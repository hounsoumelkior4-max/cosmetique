<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
     body{
        margin: 0;
        padding: 0;
        font-family: 'Great Vibes', cursive;
        background-image: linear-gradient(to bottom, #f7d2c4, #f5a9b8);
        background-attachment: fixed;
    }

    header{
        background-color: rgba(255, 255, 255, 0.5);
        padding: 20px;
        text-align: center;
    }

    h1{
        color: #8b0a1a;
        font-size: 50px;
        text-shadow: 0 0 10px rgba(139, 10, 26, 0.5);
    }

    section{
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        padding: 20px;
    }

    article{
        margin: 20px;
        width: 250px;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        padding: 20px;
        text-align: center;
    }

    img{
        width: 150px;
        height: 150px;
        border-radius: 50%;
        margin: 20px;
         box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }   

    h2{
        color: #8b0a1a;
        font-size: 25px;
    }

    p{
        color: #666;
        font-size: 17px;
    }

    .prix{
        color: #8b0a1a;
        font-size: 25px;
        font-weight: bold;
    }

    a{
        background-color: #8b0a1a;
        color: white;
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
    }

    a:hover{
        background-color: #f5f6f1;
        border-color: #8b0a1a;
    }

    footer{
        background-color: #8b0a1a;
        color: #ffffff;
        padding: 20px;
        text-align: center;
        clear: both;
    }
</style>
<body>
    <h1>Formulaire d'achat</h1>
    <label for="num">Téléphone</label>
    <input type="tel" placeholder="Entrer votre numéro"><br>
    <label for="choix">Choisissez votre produit</label>
    <select name="" id="">
        <option value="">Parfum doré</option>
        <option value="">Parfum channel</option>
    </select><br>

    <button>Valider</button>
    <a href="index.html">Retour</a>
    <footer>
    <p>Chez nous, la qualité fait la différence</p>
    <p>&copy; 2026 Tous droits reservés</p>
  </footer>
</body>
</html>
